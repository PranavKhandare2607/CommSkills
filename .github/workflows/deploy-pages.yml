name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify API
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL repository variable is not set"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "$VITE_API_BASE_URL/api/healthz"; then exit 0; fi
            sleep 5
          done
          echo "::error::API health check failed for $VITE_API_BASE_URL"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          BASE_PATH: /CommSkills
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          pnpm --filter @workspace/communication-skills run build
          cp artifacts/communication-skills/dist/public/index.html artifacts/communication-skills/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/communication-skills/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
